<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Smart Clinic</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">✚ Smart Clinic</div><nav><button onclick="show('login')">Вход</button><button onclick="show('patient')">Пациент</button><button onclick="show('doctor')">Врач</button><button onclick="show('admin')">Администратор</button></nav></header>
<main>
 <section id="login" class="card"><h1>Добро пожаловать</h1><p>Войдите в систему управления клиникой</p><label>Роль<select id="role"><option value="patient">Пациент</option><option value="doctor">Врач</option><option value="admin">Администратор</option></select></label><label>Email<input id="email" value="patient@clinic.local"></label><label>Пароль<input id="password" type="password" value="patient123"></label><button class="primary" onclick="login()">Войти</button><p id="loginMsg"></p></section>
 <section id="patient" class="hidden"><h1>Портал пациента</h1><div class="card"><h2>Найти врача</h2><input id="searchName" placeholder="Введите имя врача"><select id="specialty"><option value="">Все специальности</option><option>Терапевт</option><option>Кардиолог</option></select><button class="primary" onclick="loadDoctors()">Найти</button></div><div id="doctorList" class="grid"></div><div class="card"><h2>Мои записи</h2><button onclick="myAppointments()">Обновить список</button><pre id="patientAppointments">Нажмите «Обновить список»</pre></div></section>
 <section id="doctor" class="hidden"><h1>Портал врача</h1><div class="card"><h2>Записи пациентов</h2><label>Дата<input id="date" type="date"></label><button class="primary" onclick="doctorAppointments()">Показать</button><div id="appointmentList"></div></div></section>
 <section id="admin" class="hidden"><h1>Портал администратора</h1><div class="card"><h2>Добавить врача</h2><div class="formgrid"><input id="dn" placeholder="ФИО"><input id="ds" placeholder="Специальность"><input id="de" placeholder="Email"><input id="dp" placeholder="Пароль" type="password"></div><button class="primary" onclick="addDoctor()">Добавить врача</button><p id="adminMsg"></p></div></section>
</main><footer>Smart Clinic · Учебный проект</footer><script src="app.js"></script></body></html>
