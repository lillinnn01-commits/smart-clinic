services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_clinic
      MYSQL_USER: clinic
      MYSQL_PASSWORD: clinic123
      MYSQL_ROOT_PASSWORD: root123
    ports: ["3306:3306"]
    volumes: ["clinic_data:/var/lib/mysql", "./database:/docker-entrypoint-initdb.d"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"], interval: 5s, timeout: 5s, retries: 20}
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_clinic?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: clinic
      DB_PASSWORD: clinic123
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
volumes: {clinic_data: {}}
